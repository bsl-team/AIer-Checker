[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codefeature-kernel"
version = "0.1.0"
description = "Code style kernel: extract a developer's style from samples, audit consistency, store per-user profiles, reformat code"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
cf-web = "cf.web:main"

[tool.setuptools.packages.find]
include = ["cf*"]

[tool.setuptools.package-data]
"cf.webui" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
